[project]
name = "ads-report-automation"
version = "1.0.0"
description = "CLI tool for automated advertising reports"
authors = [{name = "Ads Report Team"}]
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "polars>=0.20.0",
    "duckdb>=0.9.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "facebook-business>=19.0.0",
    "google-ads>=22.0.0",
    "numpy>=2.0.2",
    "inquirer>=3.0.0",
    "prompt_toolkit>=3.0.0",
    "google-analytics-data>=0.18.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.22.0",
]

[project.scripts]
campaign = "src.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
