clients:
  last-minute:
    context:
      business: "Multi-brand home services company (renovation, tinting, wrapping)"
      market: "Singapore, Malaysia"
      ticket_size: "high"
      stage: "steady"
      objective: "leads"
      quality_signals:
        - "High CTR indicates good targeting and ad relevance"
        - "High CVR indicates quality traffic and landing page fit"
        - "Messaging conversations are real leads, not page views"
      notes:
        - "Homescape is the priority brand, others are secondary"
        - "MY market is price-sensitive, expect higher CPL than SG"
        - "CNY seasonal campaigns run Jan-Feb only"
    meta:
      system_user_id: "61577869030671"
      ad_accounts:
        - id: "act_1163453211889702"
          name: "DMP Singapore"
        - id: "act_475543895521800"
          name: "DMP MY"
        - id: "act_655792112740573"
          name: "Tint n' Wrap"
        - id: "act_3588231148124410"
          name: "Homescape"
    google_ads:
      customer_ids:
        - "107-310-0792"
    reporting:
      brand_rules:
        - platform: "google_ads"
          brand: "Homescape"
          source_account_ids:
            - "107-310-0792"
          default_theme: "Always On"
        - platform: "meta"
          brand: "Homescape"
          source_account_ids:
            - "act_3588231148124410"
          default_theme: "Always On"
        - platform: "meta"
          brand: "Tint n' Wrap"
          source_account_ids:
            - "act_655792112740573"
        - platform: "meta"
          brand: "DMP Singapore"
          source_account_ids:
            - "act_1163453211889702"
        - platform: "meta"
          brand: "DMP MY"
          source_account_ids:
            - "act_475543895521800"
      theme_rules:
        - platform: "meta"
          theme: "Leads"
          campaign_name_regex: "(?i)lead"
        - platform: "meta"
          theme: "Engagement - Retargeting"
          campaign_name_regex: "(?i)retarget"
        - platform: "meta"
          theme: "Engagement - Acquisition"
          campaign_name_regex: "(?i)engagement|acquisition"
        - platform: "meta"
          theme: "Seasonal"
          campaign_name_regex: "(?i)cny|seasonal|promo"
        - platform: "google_ads"
          theme: "Performance Max"
          campaign_name_regex: "(?i)performance max|pmax"
        - platform: "google_ads"
          theme: "Search"
          campaign_name_regex: "(?i)search|brand|event"
      primary_lead_rules:
        google_ads:
          include_conversion_actions: []
          exclude_conversion_actions: []
        meta:
          include_action_types:
            - "messaging_conversation_started_7d"
            - "onsite_conversion.messaging_conversation_started_7d"
      data_notes:
        - "Meta leads are counted from messaging conversation starts."
  nota:
    context:
      business: "Specialty cafe"
      market: "Malaysia"
      ticket_size: "low"
      stage: "steady"
      objective: "awareness"
      quality_signals:
        - "High CTR signals strong creative and targeting"
        - "Engagement metrics matter more than direct conversions"
      notes:
        - "Low ticket size means keep ad spend tight"
        - "Google Maps presence is important for foot traffic"
    meta:
      system_user_id: "61577869030671"
      ad_accounts:
        - id: "act_356408676260419"
          name: "Nota Cafe"
    google_ads:
      customer_ids:
        - "556-178-5391"
    reporting:
      theme_rules:
        - platform: "meta"
          theme: "Leads"
          campaign_name_regex: "(?i)lead"
        - platform: "meta"
          theme: "Engagement - Retargeting"
          campaign_name_regex: "(?i)retarget"
        - platform: "meta"
          theme: "Engagement - Acquisition"
          campaign_name_regex: "(?i)engagement|acquisition"
        - platform: "meta"
          theme: "Seasonal - CNY"
          campaign_name_regex: "(?i)cny|seasonal"
        - platform: "google_ads"
          theme: "Performance Max - Google Map"
          campaign_name_regex: "(?i)performance max|pmax|map"
        - platform: "google_ads"
          theme: "Search"
          campaign_name_regex: "(?i)search|event"
      primary_lead_rules:
        google_ads:
          include_conversion_actions: []
          exclude_conversion_actions:
            - "Page View"
            - "page_view"
        meta:
          include_action_types:
