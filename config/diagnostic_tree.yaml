# Diagnostic Tree Configuration
# Defines metrics to monitor, diagnostic checks, and thresholds
version: "1.0"

metrics:
  cpl:
    name: "Cost Per Lead"
    formula: "spend / conversions_primary"
    change_threshold: 0.10  # 10% triggers investigation
    diagnostic_checks:
      - competition
      - quality_score
      - search_term_quality
      - composition_shift

  cvr:
    name: "Conversion Rate"
    formula: "conversions_primary / clicks"
    change_threshold: 0.10
    diagnostic_checks:
      - landing_page
      - audience_quality
      - composition_shift

  volume:
    name: "Lead Volume"
    formula: "conversions_primary"
    change_threshold: 0.15
    diagnostic_checks:
      - budget_constraints
      - competition
      - composition_shift

checks:
  competition:
    name: "Competition Changes"
    description: "Detect increased auction competition"
    evidence:
      - metric: impression_share_lost_rank
        condition: "increased > 5pts"
        weight: 0.4
      - metric: avg_cpc
        condition: "increased > 10%"
        weight: 0.3
      - metric: absolute_top_is
        condition: "decreased > 5pts"
        weight: 0.3
    recommendations:
      - action: review_bids
        effort: low
        template: "Review and adjust bids for campaigns with IS loss: {affected_campaigns}"
      - action: refresh_creative
        effort: medium
        template: "Test new ad copy to improve CTR and Ad Rank for: {affected_campaigns}"

  quality_score:
    name: "Quality Score Degradation"
    description: "Detect QS drops affecting CPC"
    evidence:
      - metric: avg_quality_score
        condition: "decreased > 0.5"
        weight: 0.5
      - metric: keywords_below_qs5
        condition: "increased > 2"
        weight: 0.3
      - metric: landing_page_exp_below_avg
        condition: "increased"
        weight: 0.2
    recommendations:
      - action: qs_audit
        effort: medium
        template: "Audit and improve keywords: {affected_keywords}"
      - action: landing_page_review
        effort: high
        template: "Review landing page relevance for: {affected_campaigns}"

  search_term_quality:
    name: "Search Term Quality Decline"
    description: "Detect degradation in search query quality"
    evidence:
      - metric: junk_ratio
        condition: "increased > 5pts"
        weight: 0.5
      - metric: avg_search_term_cpl
        condition: "increased > 15%"
        weight: 0.3
      - metric: zero_conv_spend_pct
        condition: "increased > 10pts"
        weight: 0.2
    recommendations:
      - action: add_negatives
        effort: low
        template: "Add negative keywords for high-spend zero-conversion terms"
      - action: review_match_types
        effort: medium
        template: "Review broad match keywords in: {affected_campaigns}"

  composition_shift:
    name: "Traffic Composition Shift"
    description: "Detect changes in traffic mix affecting quality"
    dimensions:
      - device
      - geo
      - hour
    threshold: 0.15  # 15 percentage point shift
    evidence:
      - metric: dimension_shift_magnitude
        condition: "> 15pts"
        weight: 1.0
    recommendations:
      - action: adjust_bid_modifiers
        effort: low
        template: "Adjust {dimension} bid modifiers: {details}"

  landing_page:
    name: "Landing Page Issues"
    description: "Detect landing page experience problems"
    evidence:
      - metric: landing_page_exp_below_avg
        condition: "increased"
        weight: 0.6
      - metric: bounce_rate
        condition: "increased > 10pts"
        weight: 0.4
    recommendations:
      - action: landing_page_review
        effort: high
        template: "Review and optimize landing pages for: {affected_campaigns}"

  audience_quality:
    name: "Audience Quality Decline"
    description: "Detect degradation in audience targeting quality"
    evidence:
      - metric: cvr_by_audience
        condition: "decreased > 20%"
        weight: 0.5
      - metric: engagement_rate
        condition: "decreased > 15%"
        weight: 0.5
    recommendations:
      - action: audience_review
        effort: medium
        template: "Review audience targeting and exclusions"

  budget_constraints:
    name: "Budget Constraints"
    description: "Detect budget limitations impacting volume"
    evidence:
      - metric: search_budget_lost_is
        condition: "increased > 5pts"
        weight: 0.6
      - metric: avg_daily_spend_vs_budget
        condition: "> 90%"
        weight: 0.4
    recommendations:
      - action: increase_budget
        effort: low
        template: "Consider increasing daily budget for: {affected_campaigns}"
      - action: reallocate_budget
        effort: medium
        template: "Reallocate budget from underperforming campaigns"

thresholds:
  min_data_points: 7  # Days needed for trend analysis
  significance_level: 0.7  # R-squared threshold for trend significance
  anomaly_z_score: 2.0  # Z-score threshold for anomaly detection
  composition_shift_threshold: 0.15  # 15 percentage points
  confidence_high: 0.85
  confidence_medium: 0.50
