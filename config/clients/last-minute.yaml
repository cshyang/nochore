context:
  business: "Multi-brand home services company (renovation, tinting, wrapping)"
  notes:
    - "Homescape is the priority brand, gets most budget"
    - "CNY seasonal campaigns run Jan-Feb only"
    - "Meta leads are counted from messaging conversation starts"

sources:
  google_ads:
    homescape_ads:
      customer_id: "107-310-0792"
  meta:
    dmp_sg_meta:
      account_id: "act_1163453211889702"
      name: "DMP Singapore"
    dmp_my_meta:
      account_id: "act_475543895521800"
      name: "DMP MY"
    tint_meta:
      account_id: "act_655792112740573"
      name: "Tint n' Wrap"
    homescape_meta:
      account_id: "act_3588231148124410"
      name: "Homescape"
  ga4:
    homescape_site:
      property_id: "451924825"

business:
  brands:
    - name: "Homescape"
      context:
        market: "Singapore"
        ticket_size: "high"
        objective: "leads"
        quality_signals:
          - "High CTR indicates good targeting and ad relevance"
          - "High CVR indicates quality traffic and landing page fit"
      sources:
        - "homescape_ads"
        - "homescape_meta"
        - "homescape_site"
      default_theme: "Always On"
      filters:
        homescape_site:
          landing_page_regex: "/"
          key_events:
            - "contact_from_submit"
            - "whatsapp_link_click"
    - name: "Tint n' Wrap"
      context:
        market: "Singapore"
        ticket_size: "medium"
        objective: "leads"
        quality_signals:
          - "High CTR indicates good targeting and ad relevance"
      sources:
        - "tint_meta"
    - name: "DMP Singapore"
      context:
        market: "Singapore"
        ticket_size: "high"
        objective: "leads"
        quality_signals:
          - "High CTR indicates good targeting and ad relevance"
          - "High CVR indicates quality traffic and landing page fit"
      sources:
        - "dmp_sg_meta"
    - name: "DMP MY"
      context:
        market: "Malaysia"
        ticket_size: "high"
        objective: "leads"
        quality_signals:
          - "High CTR indicates good targeting and ad relevance"
        notes:
          - "MY market is price-sensitive, expect higher CPL than SG"
      sources:
        - "dmp_my_meta"

  theme_rules:
    - source: "dmp_sg_meta"
      theme: "Seasonal"
      campaign_name_regex: "(?i)cny|seasonal|promo"
    - source: "dmp_my_meta"
      theme: "Seasonal"
      campaign_name_regex: "(?i)cny|seasonal|promo"
    - source: "tint_meta"
      theme: "Seasonal"
      campaign_name_regex: "(?i)cny|seasonal|promo"
    - source: "homescape_meta"
      theme: "Seasonal"
      campaign_name_regex: "(?i)cny|seasonal|promo"
    - source: "homescape_ads"
      theme: "Performance Max"
      campaign_name_regex: "(?i)performance max|pmax"
