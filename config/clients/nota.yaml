context:
  business: "Refined Contemporary Restraurant Cafe"
  market: "KL, Malaysia"
  ticket_size: "low"
  stage: "mature"
  objective: "leads/walk-ins"
  quality_signals:
    - "High CTR signals strong creative and targeting"
    - "Engagement metrics matter more than direct conversions"
  notes:
    - "Low ticket size means keep ad spend tight"
    - "Running leads campaign on for Meta and Google Ads for event bookings"
    - "Google Maps presence is important for foot traffic"
    - "Meta leads are counted from messaging conversation starts"

sources:
  google_ads:
    nota_ads:
      customer_id: "556-178-5391"
  meta:
    nota_meta:
      account_id: "act_356408676260419"
      name: "Nota Cafe"
  ga4:
    nota_site:
      property_id: "400716907"
  search_console:
    main_site_sc:
      site_url: "sc-domain:notakl.com"

business:
  brands:
    - name: "Nota Cafe"
      context:
        market: "KL, Malaysia"
        ticket_size: "low"
        objective: "leads/walk-ins"
        quality_signals:
          - "High CTR signals strong creative and targeting"
          - "Engagement metrics matter more than direct conversions"
      sources:
        - "nota_ads"
        - "nota_meta"
        - "nota_site"
        - "main_site_sc"
      filters:
        main_site_sc:
          page_regex: "(?i)notakl"
          brand_terms:
            - "nota"
            - "notakl"
        nota_site:
          landing_page_regex: "/"
          key_events:
            - "form_submission"
            - "whatsapp_link_click"

  theme_rules:
    - source: "nota_meta"
      theme: "Seasonal - CNY"
      campaign_name_regex: "(?i)cny|seasonal"
    - source: "nota_ads"
      theme: "Performance Max - Google Map"
      campaign_name_regex: "(?i)performance max|pmax|map"

  lead_rules:
    google_ads:
      exclude_conversion_actions:
        - "Page View"
        - "page_view"
